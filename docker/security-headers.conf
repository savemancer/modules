# Подключается в каждом location: add_header внутри location отменяет заголовки уровня server.
#
# connect-src 'self' — ни страница, ни Web Worker с модулем игры не могут отправить
# данные на чужой домен. Это техническая гарантия того, что сейв не покидает браузер.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Devkit — инструмент для разработчиков, дублирует редактор основного сайта: в поиск не нужен
add_header X-Robots-Tag "noindex, nofollow" always;
