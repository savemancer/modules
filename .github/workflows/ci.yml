name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Закрытый деплой сайта забирает этот артефакт (registry.json + бандлы модулей)
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: modules-dist
          path: dist/
